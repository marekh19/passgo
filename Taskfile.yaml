version: "3"

vars:
  BIN: bin/passgo
  DB: dev.db

env:
  # macOS only: Apple's new linker (ld-1266) rejects the misaligned static
  # archive shipped in tigerbeetle-go ("not 8-byte aligned"). -ld_classic falls
  # back to the lenient legacy linker. Empty on Linux, where Docker/prod links
  # the *-linux.a with GNU ld and the problem doesn't exist.
  # NOTE: ld_classic is deprecated. When Apple removes it, switch to lld
  # (`brew install lld`, then -fuse-ld=lld) or re-align the archive.
  CGO_LDFLAGS: '{{if eq OS "darwin"}}-Wl,-ld_classic{{end}}'

tasks:
  app:run:
    desc: Run the app
    cmds:
      - go run ./cmd/passgo

  build:
    desc: Compile the binary into bin/
    cmds:
      - go build -o {{.BIN}} ./cmd/passgo

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  sqlc:
    desc: Regenerate type-safe Go from SQL (internal/store/generated/)
    cmds:
      - sqlc generate

  templ:gen:
    desc: Generate Go from .templ files (templ is a `go tool`, not on PATH)
    cmds:
      - go tool templ generate

  css:build:
    desc: Build Tailwind CSS (input.css -> static/css/output.css)
    cmds:
      - tailwindcss -i input.css -o static/css/output.css --minify

  generate:
    desc: Regenerate templ + css (one-shot; run before build/commit)
    deps: [templ:gen, css:build]

  dev:
    desc: "Live-reload dev (browse :8090): air watches go/templ/css, rebuilds + reloads. Needs `task tb:up`."
    env:
      # fixed secret so cookies survive the constant restarts during dev
      COOKIE_SECRET: dev-secret
    cmds:
      - air

  db:migrate:
    desc: Apply schema.sql to the dev DB ({{.DB}}, idempotent)
    cmds:
      - sqlite3 {{.DB}} ".read internal/store/schema.sql"

  tb:up:
    desc: Start TigerBeetle (formats data file on first run)
    cmds:
      - docker compose up -d tigerbeetle

  tb:down:
    desc: Stop TigerBeetle
    cmds:
      - docker compose down
