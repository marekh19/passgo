#:schema https://json.schemastore.org/any.json

# Single dev orchestrator. air watches .go / .templ / input.css; on any change it
# regenerates templ + rebuilds css (pre_cmd), recompiles, restarts the server,
# and its proxy reloads the browser. CGO_LDFLAGS for the tb link and
# COOKIE_SECRET are inherited from the Taskfile `dev` task env.
root = "."
tmp_dir = "tmp"

[build]
  # ordered: templ first (writes *_templ.go the build needs), then css.
  pre_cmd = [
    "go tool templ generate",
    "tailwindcss -i input.css -o static/css/output.css",
  ]
  cmd = "go build -o ./tmp/passgo ./cmd/passgo"
  entrypoint = ["./tmp/passgo"]

  # watch source + templates + the css source (output.css lives under static/,
  # which is excluded, so rebuilding it doesn't loop).
  include_ext = ["go", "templ", "css", "html"]
  exclude_dir = ["tmp", "bin", "static", "docs", "internal/store/generated"]
  # *_templ.go are regenerated by pre_cmd; watching them would cause a rebuild
  # loop. The .templ edit already triggers the rebuild.
  exclude_regex = ["_test\\.go", "_templ\\.go"]

  delay = 200
  stop_on_error = true

[proxy]
  # browse http://localhost:8090 -> proxied to the app on :8080, with a reload
  # script injected so the browser refreshes after each rebuild.
  enabled = true
  app_port = 8080
  proxy_port = 8090

[misc]
  clean_on_exit = true
